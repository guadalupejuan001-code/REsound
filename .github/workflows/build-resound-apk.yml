name: Build REsound APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "dist/**"
      - "scripts/build-android.sh"
      - "package.json"
      - ".github/workflows/build-resound-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: JavaScript tests
        run: npm test

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build aligned APK
        shell: bash
        run: |
          export RESOUND_BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          export RESOUND_ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          export RESOUND_JAVAC="$JAVA_HOME/bin/javac"
          chmod +x scripts/build-android.sh
          scripts/build-android.sh
          cp android/build/aligned.apk REsound-0.3.0-aligned-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
          sha256sum REsound-0.3.0-aligned-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resound-0.3.0-unsigned
          path: |
            REsound-0.3.0-aligned-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 14
