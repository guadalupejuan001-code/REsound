<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>REsound — verificación Web Audio</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 24px; max-width: 1100px; }
    h1 { font-size: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 8px; border-bottom: 1px solid currentColor; text-align: left; vertical-align: top; }
    td:last-child { overflow-wrap: anywhere; }
    .pass { color: light-dark(#13763d, #79dda0); }
    .fail { color: light-dark(#b8202c, #ff9a9f); }
    #qa-summary { font-weight: 700; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>REsound · Audio real calculado por el navegador</h1>
  <p>OfflineAudioContext: 2 canales, 48 000 muestras, 48 000 Hz. No se conecta a los altavoces.</p>
  <p id="qa-summary" role="status" aria-live="polite" data-status="running">RUNNING · verificando reproducción Web Audio…</p>
  <table>
    <thead><tr><th>Prueba</th><th>Resultado</th><th>Mediciones</th></tr></thead>
    <tbody id="qa-results"></tbody>
  </table>
  <script type="module" src="./qa-audio.mjs"></script>
</body>
</html>
